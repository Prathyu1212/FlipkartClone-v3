<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>

<body>

<header>

    <div class="logo"
         onclick="location.href='../index.html'">

        Flipkart

    </div>

</header>

<main>

    <div
        style="max-width:400px;margin:50px auto;background:white;padding:30px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.1);">

        <h2 style="margin-bottom:20px;">

            Login

        </h2>

        <input
            type="email"
            placeholder="Email"
            style="width:100%;padding:12px;margin-bottom:15px;">

        <input
            type="password"
            placeholder="Password"
            style="width:100%;padding:12px;margin-bottom:20px;">

        <button
            style="width:100%;padding:12px;background:#2874f0;color:white;border:none;border-radius:5px;">

            Login

        </button>

        <p
            style="margin-top:20px;text-align:center;">

            Don't have an account?

            <a href="signup.html">

                Sign Up

            </a>

        </p>

    </div>

</main>

</body>

</html>
