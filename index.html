<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Flipkart Clone</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <div class="logo">

            Flipkart

        </div>

        <div class="search-container">

            <input
                type="text"
                id="searchBox"
                placeholder="Search for Products">

        </div>

        <div class="header-buttons">

            <button id="loginBtn">

                Login

            </button>

            <button
                id="cartBtn"
                onclick="location.href='pages/cart.html'">

                Cart (0)

            </button>

        </div>

    </header>

    <!-- Products -->

    <main>

        <section id="productsContainer">

        </section>

    </main>

    <script
        type="module"
        src="js/main.js">

    </script>

</body>

</html>
